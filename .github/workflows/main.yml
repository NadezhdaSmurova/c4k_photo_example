name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev

          python -m pip install --upgrade pip
          python -m pip install buildozer "Cython<3"

      - name: Fix buildozer.spec
        run: |
          sed -i 's/requirements = python3,kivy,camera4kivy,gestures4kivy/requirements = python3==3.11.9,kivy,camera4kivy,gestures4kivy/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

          echo "===== CHECK ====="
          grep "^requirements" buildozer.spec
          grep "^android.accept_sdk_license" buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camera4kivy-apk
          path: bin/*.apk
